name: RITBuddy CI

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./TempBackend
        run: npm install

      - name: Run Backend Build/Check
        working-directory: ./TempBackend
        run: |
          echo "✅ Backend setup complete. Add tests if needed."

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Run Frontend Build/Check
        working-directory: ./Frontend
        run: |
          echo "✅ Frontend setup complete. Add tests/build commands here."

  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false # We'll override remote URL manually

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Configure Git user
        run: |
          git config user.email "rashmithamahesh666@gmail.com"
          git config user.name "Rashmitha666"

      - name: Run tag version script
        env:
          PAT: ${{ secrets.PAT }}
        run: python scripts/tag.py
