name: RITBuddy CI

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./TempBackend
        run: npm install

      - name: Run Backend Build/Check
        working-directory: ./TempBackend
        run: |
          echo "✅ Backend setup complete. Add tests if needed."

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install

      - name: Run Frontend Build/Check
        working-directory: ./Frontend
        run: |
          echo "✅ Frontend setup complete. Add tests/build commands here."

  updateapp:
    runs-on: windows-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            persist-credentials: true

        - name: Configure Git for tag push
          run: |
            git config --global user.name "github-actions"
            git config --global user.email "github-actions@github.com"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}


        - name: Run Python Scripts 
          run: python ./scripts/tag_new_version.py